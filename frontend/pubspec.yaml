name: veil_frontend
description: A modern, privacy-first, end-to-end encrypted messaging platform.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Cryptography
  cryptography: ^2.5.0
  flutter_secure_storage: ^9.0.0

  # Local DB
  sqflite: ^2.3.0
  path: ^1.9.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  cbor: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
